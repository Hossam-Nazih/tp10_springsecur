<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Application Sécurisée</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <div class="login-box">
        <h1>Authentification</h1>
        <p class="intro">Accédez à votre espace personnel.</p>

        <!-- Le formulaire vise l'URL surveillée par Spring Security, pas un contrôleur -->
        <form th:action="@{/authenticate}" method="post">
            <label for="nomCompte">Nom d'utilisateur :</label>
            <input type="text" id="nomCompte" name="nomCompte" placeholder="Saisir le nom d'utilisateur"
                   autocomplete="username" required autofocus>

            <label for="codeSecret">Mot de passe :</label>
            <input type="password" id="codeSecret" name="codeSecret" placeholder="Mot de passe"
                   autocomplete="current-password" required>

            <button type="submit">Se connecter</button>
        </form>

        <!-- Messages selon le paramètre ajouté à l'URL par failureUrl et logoutSuccessUrl -->
        <p th:if="${param.error}" class="error">Identifiants incorrects, veuillez réessayer.</p>
        <p th:if="${param.logout}" class="logout">Vous êtes déconnecté avec succès.</p>
    </div>
</main>
</body>
</html>
